name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Geometry + logic checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 这一步故意不装任何依赖：
      #   - check.mjs 只做排版与规则校验（结构 / 几何），不需要 sharp，也不需要中文字体
      #   - 所以它 10 秒内就能出结果，不会因为下载依赖或字体卡成十几分钟
      # 出图（PNG）与真实中文字体，需要在本地 / DSH 环境验证——CI 只守"规则有没有被改坏"。
      - name: Check every example
        run: |
          set -e
          for spec in examples/*/spec.json; do
            echo "::group::$spec"
            node scripts/check.mjs "$spec"
            echo "::endgroup::"
          done
